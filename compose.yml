services:
  msvc-config:
    container_name: msvc-config
    build: ./msvc-config/
    ports:
      - "8888:8888"
    networks:
      - uwhub-network

  msvc-discovery:
    container_name: msvc-discovery
    build: ./msvc-discovery
    ports:
      - "8761:8761"
    depends_on:
      - msvc-config
    networks:
      - uwhub-network
    env_file:
      - ./.env.dev
    restart: always

  msvc-gateway:
    container_name: msvc-gateway
    build: ./msvc-gateway
    ports:
      - "8000:8000"
    depends_on:
      - msvc-config
      - msvc-discovery
    networks:
      - uwhub-network
    env_file:
      - ./.env.dev
    restart: always

  msvc-auth:
    container_name: msvc-auth
    build: ./msvc-auth
    ports:
      - "8001:8001"
    depends_on:
      - msvc-config
      - msvc-discovery
      - msvc-gateway
    networks:
      - uwhub-network
    env_file:
      - ./.env.dev
    restart: always

  users-db:
    container_name: "users-db"
    image: "mysql:latest"
    ports:
      - "3307:3306"
    networks:
      - uwhub-network
    volumes:
      - data-auth:/etc/mysql/conf.d
    environment:
      - "MYSQL_DATABASE=users_db"
      - "MYSQL_ROOT_PASSWORD=root123"

  msvc-users:
    container_name: "msvc-users"
    build: ./msvc-users
    ports:
      - "8080:8080"
    env_file:
      - ./.env.dev
      - ./msvc-users/.env
    depends_on:
      - msvc-config
      - msvc-discovery
      - msvc-gateway
      - users-db
    restart: always
    networks:
      - uwhub-network

networks:
  uwhub-network:
volumes:
  data-auth:
